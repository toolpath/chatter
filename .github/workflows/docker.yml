# Build the Docker image for each processor. A release tag also publishes it to the GitHub Container Registry
# (ghcr.io). Users can then pull the image, instead of building it on a small computer such as a Raspberry Pi.
#
# Image: ghcr.io/toolpath/chatter (the name that docker-compose.yml uses)
# Tags:
#   a push to main       -> nothing is published: the build only checks that the images build
#   a tag such as v2.1.0 -> 2.1.0, 2.1, and latest
# Each image on ghcr.io uses storage. ghcr-cleanup.yml deletes the parts that no tagged image uses.
# A release tag also gets the signed update file for the Pi, the Docker packages for computers, and the Pi card image
# on its GitHub Release.
#
# After the first publish, make the package "chatter" public in the organisation's Packages settings.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Emulates the ARM processors on the Intel build computer
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same image name as in docker-compose.yml. ghcr.io needs lowercase names.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/toolpath/chatter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The version that the app shows, and that the update helper on the Pi compares.
      # A tag such as v1.2.0 gives 1.2.0. A push to main gives edge-<the first 7 characters of the commit>.
      - name: Choose the app version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Only a tag publishes. A push to main builds the images and fills the build cache for the next release.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            CHATTER_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Makes the signed update file that Settings > Updates installs on the Pi card, and the Docker packages for
  # computers, and adds them to the GitHub Release of the tag, with the table "Which file do I need?".
  # Only for a release tag such as v1.2.0.
  # The signing key is a secret of the "release" Environment, which gives the secret only to v[0-9]* tags.
  # A pre-release tag such as v1.2.0-rc1 publishes images, but makes no update file.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A login is not needed for a public package, but it avoids the pull limits of ghcr.io
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The update file for the Pi card. Only the update helper uses update files, and only the Pi card has the helper.
      # The script refuses a tag that is not like v1.2.0.
      # UPDATE_KEY_ID is an optional variable of the Environment. Without it, the key name is chatter-2026.
      - name: Make the signed update file
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_KEY_ID: ${{ vars.UPDATE_KEY_ID }}
        run: tools/release/make-update-file.sh "${GITHUB_REF_NAME#v}" armv7 update-files

      # Chatter for a computer, with the images in the zip, so it needs no download from ghcr.io
      - name: Make the Docker packages for computers
        run: |
          for arch in amd64 arm64; do
            tools/release/make-docker-package.sh "${GITHUB_REF_NAME#v}" "$arch" docker-packages
          done

      - name: Add the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/release/add-to-release.sh "$GITHUB_REF_NAME" update-files/*.tar docker-packages/*.zip
          tools/release/add-download-table.sh "$GITHUB_REF_NAME"

  # Makes the Raspberry Pi card image of the release, after the update file. See card.yml.
  card:
    needs: release
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/card.yml
    with:
      tag: ${{ github.ref_name }}
