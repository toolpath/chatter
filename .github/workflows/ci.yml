name: CI

on:
  push:
    branches: [main]
  # Each pull request, also one in a stack that targets another branch. GitHub does not start
  # a new run when it moves a stacked pull request to main, so the checks must run from the first push.
  pull_request:

# The jobs only read the repo
permissions:
  contents: read

# A new push to a pull request stops the run of the push before it. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-line coverage compares this branch with the main branch
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @local-chatter/shared

      - name: Typecheck
        run: npm run typecheck

      # Fails on a lint error. Warnings (such as complexity) are signals and do not fail.
      - name: Lint
        run: npm run lint

      # Fails when the pull request adds code that is a copy of other code (70 tokens or more).
      # Copies that are already on the base branch do not fail.
      - name: Check for new copied code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run -s dup -- --baseline-from-ref "origin/$BASE_REF" --fail-on-new-clones

      # Unused files, dependencies and exports. Only a report for now.
      - name: Show unused code in the job summary
        run: npx knip --no-progress --no-exit-code --reporter markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test

      # Coverage is a signal, not a gate (no thresholds). These steps only report.
      - name: Measure coverage
        run: npm run coverage

      - name: Show coverage in the job summary
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          npm run -s coverage:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Show changed-line coverage in the job summary
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo '## Changed lines with no test' >> "$GITHUB_STEP_SUMMARY"
          npm run -s coverage:changed -- --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"

      # The lines that the commits of the pull request add and remove: code, tests, docs and comments.
      # Only a report: a failure of the tool does not stop the job.
      - name: Show the size of the change in the job summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo '## Size of the change' >> "$GITHUB_STEP_SUMMARY"
          npm run -s loc -- --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The tests of the history backup with a real VictoriaMetrics and vmalert (the versions and the container rights
  # of docker-compose.yml). The script starts them with docker run: a service container cannot get the arguments
  # that they need. The job also tests that VictoriaMetrics with the container rights uses an old volume and a
  # restored backup.
  history-backup-real-victoriametrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @local-chatter/shared

      - name: Start VictoriaMetrics and vmalert
        run: tools/victoria-test/start.sh

      - name: Run the tests with the real VictoriaMetrics
        env:
          CHATTER_TEST_VICTORIA_URL: http://127.0.0.1:18429
        run: npm run test:run -w apps/server -- src/history-backup src/routes/historyBackup

      # It makes its own container and volumes on a different port, and removes them at the end
      - name: Test VictoriaMetrics with the container rights on an old volume and a restored backup
        run: tools/victoria-test/old-volume.test.sh

      - name: Show the log of VictoriaMetrics and vmalert after a failure
        if: failure()
        run: |
          docker logs chatter-test-victoriametrics
          docker logs chatter-test-vmalert

      - name: Stop VictoriaMetrics and vmalert
        if: always()
        run: tools/victoria-test/stop.sh

  # Fails on a known high or critical vulnerability in a dependency.
  # npm audit reads the lockfile only, so this job does not install packages.
  # The root lockfile covers apps/server, apps/web and packages/shared.
  # docs/ has its own lockfile. Its packages are dev dependencies that build the static site,
  # so that step uses --omit=dev: vitepress 1.6 pins vite 5, and no fix is available for it yet.
  # tools/fake-machines and tools/fake-notify have no dependencies.
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit app dependencies
        run: npm audit --audit-level=high

      - name: Audit docs dependencies
        if: ${{ !cancelled() }}
        run: npm audit --prefix docs --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The Content-Security-Policy of the server blocks scripts in the page, eval and styles from other sites.
      # This step fails when the built web app has one of them.
      - name: Check the built web app for the Content-Security-Policy
        run: npm run check:web-dist
